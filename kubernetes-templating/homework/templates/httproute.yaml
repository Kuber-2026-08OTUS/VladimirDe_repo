{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: {{ .Values.httpRoute.name }}

spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}

  hostnames:
    - {{ .Values.host | quote }}

  rules:
    - matches:
        - path:
            type: Exact
            value: /homepage

      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /index.html

      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: {{ .Values.service.name }}
          port: {{ .Values.service.port }}
{{- end }}
