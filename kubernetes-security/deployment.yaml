apiVersion: apps/v1
kind: Deployment

metadata:
  name: homework-deployment
  namespace: homework

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

  selector:
    matchLabels:
      app: homework

  template:
    metadata:
      labels:
        app: homework

    spec:
      serviceAccountName: monitoring

      nodeSelector:
        homework: "true"

      initContainers:
        - name: init-container
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              wget -O /init/index.html https://kubernetes.io/docs/concepts/workloads/pods/init-containers/

          volumeMounts:
            - name: homework-volume
              mountPath: /init

        - name: metrics
          image: busybox:1.37
          command:
            - sh
            - -c
            - |
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)

              wget \
                --no-check-certificate \
                --header="Authorization: Bearer $TOKEN" \
                -O /init/metrics.html \
                https://kubernetes.default.svc/metrics

          volumeMounts:
            - name: homework-volume
              mountPath: /init

      containers:
        - name: web
          image: busybox:1.37

          command:
            - sh
            - -c
            - |
              httpd -f -p 8000 -h /homework

          ports:
            - containerPort: 8000

          volumeMounts:
            - name: homework-volume
              mountPath: /homework

            - name: homework-config
              mountPath: /homework/conf

          readinessProbe:
            httpGet:
              path: /index.html
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 5

          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - rm -f /homework/index.html

      volumes:
        - name: homework-volume
          persistentVolumeClaim:
            claimName: homework-pvc

        - name: homework-config
          configMap:
            name: homework-config

